[project]
name = "llm-regression-ci"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RoroLab", email = "romain.mazoyer@paprec.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mistralai>=2",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
llm-regression-ci = "llm_regression_ci:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
